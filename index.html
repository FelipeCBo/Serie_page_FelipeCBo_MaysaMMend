<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <title>Mafe — Catálogo de Séries</title>
    <script>
        if (localStorage.getItem("tema") === "escuro") {
            document.documentElement.classList.add("dark_background");
        }
    </script>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo" id="logo_toggle" title="Alternar tema">
            <span class="logo_mark">M</span>
            <span class="logo_text">Mafe</span>
        </a>

        <nav class="menu">
            <a href="index.html" class="menu_link active">Home</a>
            <a href="form.html" class="menu_link">Cadastro</a>
        </nav>
    </header>

    <main class="home_content">

        <!-- CARROSSEL DE DESTAQUES -->
        <section class="carousel" id="carousel" hidden>
            <div class="carousel_track" id="carousel_track"></div>

            <button type="button" class="carousel_arrow carousel_prev" id="carousel_prev" aria-label="Anterior">‹</button>
            <button type="button" class="carousel_arrow carousel_next" id="carousel_next" aria-label="Próximo">›</button>

            <div class="carousel_dots" id="carousel_dots"></div>
        </section>

        <!-- ESTADO VAZIO -->
        <div class="empty_state" id="empty_state" hidden>
            <div class="empty_icon">🎬</div>
            <h3>Seu catálogo está vazio</h3>
            <p>Adicione sua primeira série e comece a montar sua coleção.</p>
            <a href="form.html" class="empty_button">+ Adicionar série</a>
        </div>

        <!-- SEÇÃO: TODAS AS SÉRIES -->
        <section class="catalog_section" id="catalog_section">
            <div class="section_header">
                <h2 class="section_title">Todas as séries</h2>
                <span class="catalog_counter" id="catalog_counter">0 séries</span>
            </div>

            <div class="home_controls">
                <input
                    type="search"
                    id="search_input"
                    class="search_input"
                    placeholder="Buscar por título..."
                    autocomplete="off"
                >

                <select id="sort_select" class="sort_select">
                    <option value="recentes">Mais recentes</option>
                    <option value="antigas">Mais antigas</option>
                    <option value="az">A → Z</option>
                    <option value="za">Z → A</option>
                    <option value="melhores">Melhor avaliadas</option>
                </select>
            </div>

            <div class="genre_filter" id="genre_filter"></div>

            <div class="series_catalog" id="series_catalog"></div>
        </section>

    </main>

    <footer class="footer">
        <p>Feito com ♥ por você · Mafe 2026</p>
    </footer>

    <!-- Modal de confirmação -->
    <div class="modal_overlay" id="modal_overlay" hidden>
        <div class="modal_box">
            <h3 class="modal_title">Deletar série?</h3>
            <p class="modal_text" id="modal_text">Tem certeza que deseja deletar esta série?</p>
            <div class="modal_actions">
                <button type="button" class="modal_btn modal_btn_cancel" id="modal_cancel">Cancelar</button>
                <button type="button" class="modal_btn modal_btn_confirm" id="modal_confirm">Deletar</button>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
