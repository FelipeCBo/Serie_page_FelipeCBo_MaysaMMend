<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <title>Cadastro — Mafe</title>
    <script>
        if (localStorage.getItem("tema") === "escuro") {
            document.documentElement.classList.add("dark_background");
        }
    </script>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo" id="logo_toggle" title="Alternar tema">
            <span class="logo_mark">M</span>
            <span class="logo_text">Mafe</span>
        </a>

        <nav class="menu">
            <a href="index.html" class="menu_link">Home</a>
            <a href="form.html" class="menu_link active">Cadastro</a>
        </nav>
    </header>

    <main class="page_content">
        <form id="meu_formulario" novalidate>

            <h2 class="form_title" id="form_title">Adicionar nova série</h2>

            <div class="form_group">
                <label for="stitulo">Nome da série</label>
                <input type="text" name="stitulo" id="stitulo" placeholder="Ex: Breaking Bad" required>
                <span class="form_error" id="erro_titulo"></span>
            </div>

            <div class="form_group">
                <label for="genero">Gênero</label>
                <select name="genero" id="genero" class="form_select">
                    <option value="">Selecione um gênero</option>
                    <option value="Ação">Ação</option>
                    <option value="Aventura">Aventura</option>
                    <option value="Comédia">Comédia</option>
                    <option value="Drama">Drama</option>
                    <option value="Ficção">Ficção</option>
                    <option value="Terror">Terror</option>
                    <option value="Suspense">Suspense</option>
                    <option value="Outro">Outro</option>
                </select>
                <span class="form_error" id="erro_genero"></span>
            </div>

            <div class="form_group">
                <label for="image">Imagem de capa</label>
                <input type="file" name="image" id="image" accept="image/*">
                <span class="form_error" id="erro_image"></span>
                <div class="image_preview" id="image_preview" hidden>
                    <img id="preview_img" src="" alt="Pré-visualização">
                    <button type="button" class="preview_remove" id="preview_remove">Remover imagem</button>
                </div>
            </div>

            <div class="form_group">
                <label for="desc">Sinopse</label>
                <textarea name="desc" id="desc" placeholder="Escreva sobre a série..." required></textarea>
                <span class="form_error" id="erro_desc"></span>
            </div>

            <div class="form_actions">
                <button type="submit" id="submit_button">Enviar série</button>
                <a href="index.html" class="cancel_link" id="cancel_link" hidden>Cancelar edição</a>
            </div>

        </form>
    </main>

    <footer class="footer">
        <p>Feito com ♥ por você · Mafe 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
