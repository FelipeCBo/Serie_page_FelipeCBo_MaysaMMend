<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <title>Série — Mafe</title>
    <script>
        if (localStorage.getItem("tema") === "escuro") {
            document.documentElement.classList.add("dark_background");
        }
    </script>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo" id="logo_toggle" title="Alternar tema">
            <span class="logo_mark">M</span>
            <span class="logo_text">Mafe</span>
        </a>

        <nav class="menu">
            <a href="index.html" class="menu_link">Home</a>
            <a href="form.html" class="menu_link">Cadastro</a>
        </nav>
    </header>

    <main class="page_content">
        <article class="movie_body">

            <!-- Fundo desfocado com a própria capa -->
            <div class="movie_backdrop" id="movie_backdrop"></div>

            <div class="movie_inner">

                <div class="image_container">
                    <img id="serie_image" src="" alt="Imagem da série">
                </div>

                <div class="serie_log">

                    <div class="stars" id="stars" data-serie-id="">
                        <span data-value="1">★</span>
                        <span data-value="2">★</span>
                        <span data-value="3">★</span>
                        <span data-value="4">★</span>
                        <span data-value="5">★</span>
                    </div>

                    <h1 class="serie_name" id="serie_name">Carregando...</h1>

                    <span class="serie_genre" id="serie_genre"></span>

                    <p class="sinopse" id="sinopse">Carregando informações da série...</p>

                    <div class="serie_actions">
                        <a href="index.html" class="btn_back">← Voltar</a>
                        <a href="form.html" class="btn_edit" id="btn_edit">Editar série</a>
                    </div>

                </div>

            </div>

        </article>
    </main>

    <footer class="footer">
        <p>Feito com ♥ por você · Mafe 2026</p>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
